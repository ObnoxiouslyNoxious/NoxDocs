site_name: NoxDocs
site_description: Documentation for ObnoxiouslyNoxious's Project Zomboid mods
site_url: https://obnoxiouslynoxious.github.io/NoxDocs/
repo_url: https://github.com/ObnoxiouslyNoxious/NoxDocs
repo_name: ObnoxiouslyNoxious/NoxDocs

theme:
  name: material
  custom_dir: theme-overrides
  palette:
    - scheme: slate
      primary: black
      accent: grey
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github
  favicon: assets/img/favicon.png
  logo: assets/img/logo-book.png

copyright: >
  <a href="https://obnox.dev/" target="_blank" rel="noopener"
     style="display:inline-flex;align-items:center;gap:8px;color:inherit;text-decoration:none;">
    <img src="https://obnoxiouslynoxious.github.io/NoxDocs/assets/img/logo-flycut.png"
         alt="ObnoxiouslyNoxious" width="26" height="26" style="vertical-align:middle;">
    <span>ObnoxiouslyNoxious</span>
  </a>

plugins:
  - search
  - glightbox:
      touchNavigation: true
      loop: false
      effect: fade
      slide_effect: slide
      width: 90%
      height: auto
      zoomable: true
      draggable: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/nav-collapsed.js

extra:
  custom_dir: docs/overrides

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      title: Table of Contents

nav:
  - Home: index.md
  - Mods:
      - Overview: mods/index.md
      - "Zombies Have Money": mods/zombies-have-money.md
      - "Zombies Have Smokes": mods/zombies-have-smokes.md
      - "Zombies Have Ammo": mods/zombies-have-ammo.md
      - "Random Spawn Locations": mods/random-spawn-locations.md
      - "NPC Tiles": mods/npc-tiles.md
      - "Dynamic Challenges & Leaderboard": mods/daily-challenge-system.md
      - "XP Ranks": mods/xp-ranks.md
      - "DeadSplit": mods/deadsplit.md
      - "Livestock Traders": mods/livestock-traders.md
      - "Sidebar Drawer": mods/sidebar-drawer.md
      - "Auto-Drink Expanded": mods/auto-drink-expanded.md
      - "Auto-Drunk": mods/auto-drunk.md
      - "Auto-Drink Revert": mods/auto-drink-revert.md
      - "GTA Menu Theme": mods/gta-menu-theme.md
      - "RDR Menu Theme": mods/rdr-menu-theme.md
      - "Skill Master": mods/skill-master.md
      - "GNC Starting Clothes": mods/gnc-starting-clothes.md
      - "AEBS Imperial & Metric Display": mods/aebs-converter.md
      - "Menu Theme Framework": mods/menu-theme-framework.md
  - Documentation:
      - Overview: documentation/index.md
      - Framework:
          - "Menu Theme Framework":
              - Introduction: documentation/menu-theme-framework/index.md
              - Getting Started: documentation/menu-theme-framework/getting-started.md
              - Audio: documentation/menu-theme-framework/audio.md
              - Graphics: documentation/menu-theme-framework/images.md
              - Video: documentation/menu-theme-framework/video.md
              - Buttons and Layouts: documentation/menu-theme-framework/buttons-and-layouts.md
              - Cards and Styling: documentation/menu-theme-framework/cards-and-styling.md
              - Settings and Translations: documentation/menu-theme-framework/settings-and-translations.md
              - Reference: documentation/menu-theme-framework/reference.md
              - Troubleshooting: documentation/menu-theme-framework/troubleshooting.md
              - Glossary: documentation/menu-theme-framework/glossary.md
      - API:
          - "Dynamic Challenges": documentation/api/dynamic-challenges.md
          - "NPC Tiles": documentation/api/npc-tiles.md
          - "XP Ranks": documentation/api/xp-ranks.md
  - Credits: credits.md
